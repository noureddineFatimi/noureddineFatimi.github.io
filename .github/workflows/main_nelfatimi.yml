# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nelfatimi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      API_BASE_URL_GITHUB: ${{ secrets.API_BASE_URL_GITHUB }}
      CACHE_TTL_GITHUB: ${{ secrets.CACHE_TTL_GITHUB }}
      EMBEDDING_MODEL_PROVIDER: ${{ secrets.EMBEDDING_MODEL_PROVIDER }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HF_EMBEDDING_BASE_URL: ${{ secrets.HF_EMBEDDING_BASE_URL }}
      HF_EMBEDDING_MODEL: ${{ secrets.HF_EMBEDDING_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      MAIN_GITHUB_REPOSITORIES_BRANCH: ${{ secrets.MAIN_GITHUB_REPOSITORIES_BRANCH }}
      MAX_TREE_LENGTH: ${{ secrets.MAX_TREE_LENGTH }}
      PERSONAL_ACCESS_TOKEN_GITHUB: ${{ secrets.PERSONAL_ACCESS_TOKEN_GITHUB }}
      READING_GITHUB_FILE_MAX_FILE_LENGTH: ${{ secrets.READING_GITHUB_FILE_MAX_FILE_LENGTH }}
      REPOS_CACHE_KEY_GITHUB: ${{ secrets.REPOS_CACHE_KEY_GITHUB }}
      REPO_FILE_CONTENT_CACHE_KEY_PREFIX_GITHUB: ${{ secrets.REPO_FILE_CONTENT_CACHE_KEY_PREFIX_GITHUB }}
      REPO_METADATA_CACHE_KEY_PREFIX_GITHUB: ${{ secrets.REPO_METADATA_CACHE_KEY_PREFIX_GITHUB }}
      REPO_TREE_CACHE_KEY_PREFIX_GITHUB: ${{ secrets.REPO_TREE_CACHE_KEY_PREFIX_GITHUB }}
      SESSION_TTL: ${{ secrets.SESSION_TTL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      USERNAME_GITHUB: ${{ secrets.USERNAME_GITHUB }}
      VECTOR_DATABASE_API_KEY: ${{ secrets.VECTOR_DATABASE_API_KEY }}
      VECTOR_DATABASE_INDEX_NAME: ${{ secrets.VECTOR_DATABASE_INDEX_NAME }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire l'application
        run: pnpm run build

      - name: Créer l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A12A50F311BB486896AF29AE595B5CDA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1B93D88989854133BE95B5BCBC17032E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FCA872CD84D84A4297096A7ABF13E9AD }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nelfatimi'
          slot-name: 'Production'
          package: .
          
